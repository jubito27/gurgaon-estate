name: Gurgaon Estate CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gurgaon-estate-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-southeast-2
      AWS_ACCOUNT_ID: "970734043001"
      ECR_REPOSITORY: gugaon_estate_ecr
      ECR_IMAGE: 970734043001.dkr.ecr.ap-southeast-2.amazonaws.com/gugaon_estate_ecr
      DVC_REMOTE_BUCKET: gurgaon-estate
      CODEDEPLOY_APP: gurgaon-estate
      CODEDEPLOY_GROUP: gurgaon-estate-deployment-group
      TARGET_GROUP_ARN: arn:aws:elasticloadbalancing:ap-southeast-2:970734043001:targetgroup/gurgaon-estate-public-tg/740a28249f892420
      PUBLIC_URL: http://ec2-balancer-1-1963961444.ap-southeast-2.elb.amazonaws.com:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: flask-app/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS deployment resources
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null
          aws deploy get-deployment-group --application-name "$CODEDEPLOY_APP" --deployment-group-name "$CODEDEPLOY_GROUP" --region "$AWS_REGION" >/dev/null
          aws elbv2 describe-target-groups --target-group-arns "$TARGET_GROUP_ARN" --region "$AWS_REGION" >/dev/null

      - name: Install DVC and application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dvc[s3]>=3.0,<4" -r flask-app/requirements.txt

      - name: Restore only the DVC artifacts required by the web application
        run: |
          dvc pull data/processed/feature_selection model/pipeline.pkl model/recommendation
          test -s data/processed/feature_selection/gurgaon_properties_post_feature_selection_v2.csv
          test -s model/pipeline.pkl
          test -s model/recommendation/recommendation_model.joblib
          test -s model/recommendation/property_catalog.csv

      - name: Run regression pipeline tests
        run: python -m unittest tests/test_model.py

      - name: Run Flask API and frontend contract tests
        run: python -m unittest tests/test_flask_app.py

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push optimized production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.ECR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the exact image pushed to ECR
        run: |
          docker pull "${ECR_IMAGE}:${GITHUB_SHA}"
          docker run --detach --name gurgaon-estate-smoke \
            --publish 127.0.0.1:5050:5000 "${ECR_IMAGE}:${GITHUB_SHA}"
          cleanup() {
            docker logs --tail 100 gurgaon-estate-smoke || true
            docker rm --force gurgaon-estate-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 4 http://127.0.0.1:5050/health; then
              curl --fail --silent --show-error http://127.0.0.1:5050/ >/dev/null
              curl --fail --silent --show-error http://127.0.0.1:5050/api/options | python -c 'import json,sys; data=json.load(sys.stdin); assert data["sectors"] and data["apartments"]'
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy." >&2
          exit 1

      - name: Package immutable CodeDeploy revision
        run: |
          printf '%s\n' "${ECR_IMAGE}:${GITHUB_SHA}" > image_uri.txt
          zip -r deployment.zip appspec.yml deploy/scripts image_uri.txt
          test -s deployment.zip

      - name: Upload versioned deployment revision
        run: |
          aws s3 cp deployment.zip \
            "s3://$DVC_REMOTE_BUCKET/deployments/$GITHUB_SHA/deployment.zip" \
            --region "$AWS_REGION"

      - name: Deploy Gurgaon Estate to its dedicated Auto Scaling Group
        id: deploy
        run: |
          DEPLOYMENT_ID="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APP" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location "bucket=$DVC_REMOTE_BUCKET,key=deployments/$GITHUB_SHA/deployment.zip,bundleType=zip" \
            --file-exists-behavior OVERWRITE \
            --region "$AWS_REGION" \
            --query deploymentId --output text)"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Started Gurgaon Estate deployment: $DEPLOYMENT_ID"

      - name: Wait for CodeDeploy deployment
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          if ! aws deploy wait deployment-successful \
            --deployment-id "$DEPLOYMENT_ID" --region "$AWS_REGION"; then
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
              --region "$AWS_REGION" --output json || true
            exit 1
          fi

      - name: Verify public target health and website endpoint
        run: |
          for attempt in $(seq 1 60); do
            HEALTHY="$(aws elbv2 describe-target-health \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==\x60healthy\x60])' \
              --output text --region "$AWS_REGION")"
            echo "Healthy Gurgaon Estate targets: $HEALTHY"
            if [[ "$HEALTHY" -ge 1 ]] && curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              curl --fail --silent --show-error "$PUBLIC_URL/" >/dev/null
              exit 0
            fi
            sleep 10
          done
          echo "Gurgaon Estate did not become healthy on the public endpoint." >&2
          aws elbv2 describe-target-health --target-group-arn "$TARGET_GROUP_ARN" --region "$AWS_REGION"
          exit 1
