stages:
  1_data_preprocessing_flats:
    cmd: python src/data/1_data_pre_flats.py
    deps:
    - src/data/1_data_pre_flats.py
    outs:
    - data/processed/flats
  2_data_preprocessing_houses:
    cmd: python src/data/2_data_pre_houses.py
    deps:
    - src/data/1_data_pre_flats.py
    - src/data/2_data_pre_houses.py
    outs:
    - data/processed/houses
  3_merging_both_houses_and_flats:
    cmd: python src/data/3_merge.py
    deps:
    - src/data/2_data_pre_houses.py
    - src/data/3_merge.py
    outs:
    - data/processed/merged
  4_preprocessing_on_merged_data:
    cmd: python src/data/4_merged_preprocessing.py
    deps:
    - src/data/3_merge.py
    - src/data/4_merged_preprocessing.py
    outs:
    - data/processed/cleaned
  5_feature_engineering:
    cmd: python src/features/1_feature_engineering.py
    deps:
    - data/processed/cleaned/
    - src/features/1_feature_engineering.py
    outs:
    - data/interim/
  6_outlier_detection:
    cmd: python src/data/5_outlier_detection.py
    deps:
    - data/interim/v1/
    - src/data/5_outlier_detection.py
    outs:
    - data/processed/outlier_removed/
  7_missing_values:
    cmd: python src/data/6_missing_value.py
    deps:
    - data/processed/outlier_removed/
    - src/data/6_missing_value.py
    outs:
    - data/processed/missing_value/
  8_feature_selection:
    cmd: python src/features/2_feature_selection.py
    deps:
    - data/processed/missing_value/
    - src/features/2_feature_selection.py
    outs:
    - data/processed/feature_selection/
  9_feature_transformation:
    cmd: python src/features/3_feature_transformation.py
    deps:
    - data/processed/feature_selection/
    - src/features/3_feature_transformation.py
    outs:
    - data/processed/feature_transformation/
  10_model_training:
    cmd: python src/models/train_model.py
    deps:
    - data/processed/feature_selection/gurgaon_properties_post_feature_selection_v2.csv
    - src/models/train_model.py
    - params.yaml
    outs:
    - model/
  11_model_prediction:
    cmd: python src/models/predict_model.py --input-path 
      data/processed/feature_selection/gurgaon_properties_post_feature_selection_v2.csv
      --output-path reports/predictions/predictions.csv --output-dir 
      reports/predictions --model-dir model
    deps:
    - data/processed/feature_selection/gurgaon_properties_post_feature_selection_v2.csv
    - src/models/predict_model.py
    - model/
    outs:
    - reports/predictions/predictions.csv
params:
- dvclive/params.yaml
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
artifacts:
  pipeline:
    path: model/pipeline.pkl
  preprocessor:
    path: model/preprocessor.pkl
  model_metadata:
    path: model/model_metadata.json
